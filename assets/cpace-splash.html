<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CPAce — Loading</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,800;0,900;1,500;1,600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:      #16171A;
    --oxblood:  #6E1018;
    --maroon:   #8E1520;
    --crimson:  #A81D28;
    --paper:    #FFFFFF;
    --paper-2:  #FAF9F9;
    --ash:      #5A5B60;
    --ash-soft: #9A9BA1;

    --display: "Montserrat", system-ui, "Segoe UI", Arial, sans-serif;
    --ui:      "Poppins", system-ui, "Segoe UI", Arial, sans-serif;

    /* master speed dial: 0.8 = snappier, 1.2 = slower — scales every delay below */
    --t: 1;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    display:flex; align-items:center; justify-content:center;
    min-height:100%; background:#0d0d0e;
    font-family:var(--ui);
    -webkit-font-smoothing:antialiased;
  }

  /* ============ SPLASH ROOT — this is the element to drop into your app ============ */
  #cpace-splash{
    container-type:size;
    position:relative;
    width:100vw; height:100dvh;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(120% 85% at 50% 42%, var(--paper) 0%, var(--paper) 60%, var(--paper-2) 100%);
    overflow:hidden;
  }

  .inner{
    position:relative; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    padding: max(24px, env(safe-area-inset-top)) 6% max(28px, env(safe-area-inset-bottom));
  }

  /* the lockup starts pushed right so the icon sits dead-centre first,
     then swipes left into its resting position beside the wordmark */
  .lockup{
    position:relative;
    display:flex; align-items:center; justify-content:center;
    gap:2.2cqw; width:min(92cqw, 640px);
    transform:translateX(30%) scale(1.08);
  }
  .run .lockup{ animation:swipeLeft .9s cubic-bezier(.6,0,.15,1) calc(3.05s * var(--t)) forwards; }

  /* ---- icon stack: vector build-up UNDER the real logo art, crossfaded at the end ---- */
  .icon-stack{ position:relative; width:44%; flex:none; }
  .icon-stack svg{ display:block; width:100%; height:auto; overflow:visible; }
  .icon-final{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:contain; opacity:0;
  }
  .run .icon-final{ animation:fadeIn .35s linear calc(2.55s * var(--t)) forwards; }
  .run .icon-build{ animation:fadeOut .35s linear calc(2.55s * var(--t)) forwards; }

  .type{ position:relative; min-width:0; }
  .type img{ display:block; width:100%; height:auto; }
  .wordmark-wrap{
    width:min(50cqw, 360px);
    clip-path:inset(0 100% 0 0);
  }
  .run .wordmark-wrap{ animation:wipe .95s cubic-bezier(.6,0,.24,1) calc(3.55s * var(--t)) forwards; }

  /* ---------- loading bar ---------- */
  .loader{
    position:absolute; left:0; right:0;
    bottom:max(34px, env(safe-area-inset-bottom));
    display:flex; flex-direction:column; align-items:center; gap:13px; opacity:0;
  }
  .run .loader{ animation:fadeIn .6s ease calc(.45s * var(--t)) forwards; }

  .track{
    position:relative; width:min(46cqw, 220px); height:4px;
    border-radius:999px; background:rgba(110,16,24,.09);
  }
  .track i{
    position:absolute; left:0; top:0; bottom:0; width:4px;
    border-radius:999px;
    background:linear-gradient(90deg, var(--oxblood), var(--crimson));
    transform:scale(0); transform-origin:left center;
  }
  .run .track i{ animation:inkDrop 4.6s cubic-bezier(.4,0,.15,1) calc(.55s * var(--t)) forwards; }
  .track i::after{
    content:""; position:absolute; right:-3px; top:50%;
    width:11px; height:11px; margin-top:-5.5px; border-radius:50%;
    background:var(--crimson); opacity:.22; filter:blur(3px);
  }

  .status{
    font-family:var(--ui); font-weight:500;
    font-size:min(2.6cqw, 12px); letter-spacing:.2em;
    text-transform:uppercase; color:var(--ash-soft); opacity:0;
  }
  .run .status{ animation:fadeIn .7s ease calc(.8s * var(--t)) forwards; }

  /* ---------- exit bloom (call finishSplash() to trigger) ---------- */
  .bloom{
    position:absolute; left:50%; top:46%;
    width:120px; height:120px; margin:-60px 0 0 -60px; border-radius:50%;
    background:radial-gradient(circle at 50% 45%, var(--maroon) 0%, var(--oxblood) 70%, #560B12 100%);
    transform:scale(0); opacity:0; pointer-events:none; will-change:transform;
  }
  #cpace-splash.exit .bloom{ animation:bloom 1.15s cubic-bezier(.62,0,.24,1) forwards; }
  #cpace-splash.exit .fadeout-group{ animation:fadeOut .5s ease .3s forwards; }
  #cpace-splash.exit .lockup{ animation:fadeOut .5s ease .3s forwards; }

  /* ============ vector build-up: book opens → calculator rises → chart draws ============ */
  .book-closed{ transform-box:fill-box; transform-origin:264px 305px; opacity:1; }
  .run .book-closed{ animation:closedFade .35s ease calc(.62s * var(--t)) forwards; }

  .book-shadow{ opacity:0; transform-box:fill-box; transform-origin:center; transform:scaleX(.3); }
  .run .book-shadow{ animation:shadowIn .8s cubic-bezier(.2,.85,.25,1) calc(.15s * var(--t)) forwards; }

  .fan{ transform-box:fill-box; transform-origin:264px 305px; transform:scaleX(.05); opacity:0; }
  .run .fan{ animation:fanOut .6s cubic-bezier(.16,.9,.24,1) forwards; }
  .run .p1{ animation-delay:calc(.30s * var(--t)) }
  .run .p2{ animation-delay:calc(.38s * var(--t)) }

  .flip{ transform-box:fill-box; transform-origin:264px 305px; }
  .run .flip{ animation:fanOut .6s cubic-bezier(.16,.9,.24,1) forwards,
                        turn .8s cubic-bezier(.42,.04,.3,1) forwards; }
  .run .f1{ animation-delay:calc(.46s * var(--t)), calc(1.0s * var(--t)); }
  .run .f2{ animation-delay:calc(.54s * var(--t)), calc(1.24s * var(--t)); }

  .calc{ transform-box:fill-box; transform-origin:center; opacity:0; transform:translateY(30px) scale(.88); }
  .run .calc{ animation:rise .85s cubic-bezier(.16,1,.3,1) calc(1.68s * var(--t)) forwards; }

  .bar{ transform-box:fill-box; transform-origin:bottom center; transform:scaleY(0); }
  .run .bar{ animation:grow .6s cubic-bezier(.16,1,.3,1) forwards; }
  .run .bar1{ animation-delay:calc(2.02s * var(--t)) }
  .run .bar2{ animation-delay:calc(2.12s * var(--t)) }
  .run .bar3{ animation-delay:calc(2.22s * var(--t)) }

  .shaft{ stroke-dasharray:260; stroke-dashoffset:260; }
  .run .shaft{ animation:draw .55s cubic-bezier(.46,0,.2,1) calc(2.18s * var(--t)) forwards; }

  .head{ transform-box:fill-box; transform-origin:60% 70%; transform:scale(0); opacity:0; }
  .run .head{ animation:pop .4s cubic-bezier(.2,1.45,.4,1) calc(2.5s * var(--t)) forwards; }

  .tagline-note{ display:none; }

  /* ---------- keyframes ---------- */
  @keyframes fadeIn    { to{ opacity:1 } }
  @keyframes fadeOut   { to{ opacity:0 } }
  @keyframes closedFade{ to{ opacity:0 } }
  @keyframes shadowIn  { to{ opacity:1; transform:scaleX(1) } }
  @keyframes fanOut    { to{ opacity:1; transform:scaleX(1) } }
  @keyframes swipeLeft { to{ transform:translateX(0) scale(1) } }
  @keyframes wipe      { to{ clip-path:inset(0 0 0 0) } }

  @keyframes turn{
    0%   { transform:scaleX(1)    scaleY(1)    rotate(0deg) }
    50%  { transform:scaleX(0.02) scaleY(1.05) rotate(-3deg) }
    100% { transform:scaleX(-1)   scaleY(1)    rotate(0deg) }
  }

  @keyframes rise { to{ opacity:1; transform:translateY(0) scale(1) } }
  @keyframes grow { to{ transform:scaleY(1) } }
  @keyframes draw { to{ stroke-dashoffset:0 } }
  @keyframes pop  { to{ opacity:1; transform:scale(1) } }

  @keyframes inkDrop{ 0%{ width:4px; transform:scale(0) } 8%{ width:4px; transform:scale(1) } 100%{ width:100%; transform:scale(1) } }
  @keyframes bloom  { from{ opacity:1; transform:scale(0) } to{ opacity:1; transform:scale(26) } }

  @media (prefers-reduced-motion: reduce){
    .run *{ animation-duration:.01ms !important; animation-delay:0ms !important; animation-iteration-count:1 !important; }
  }
</style>
</head>

  <div id="cpace-splash" class="run">
    <div class="inner">

      <div class="lockup">
        <div class="icon-stack">

          <!-- vector build-up (fades out once real art crossfades in) -->
          <svg class="icon-build" viewBox="0 0 548 316" role="img" aria-label="CPAce mark">
            <defs>
              <linearGradient id="pageRed" x1="1" y1="1" x2="0" y2="0">
                <stop offset="0%" stop-color="#6E1018"/><stop offset="55%" stop-color="#8E1520"/><stop offset="100%" stop-color="#A81D28"/>
              </linearGradient>
              <linearGradient id="pageInk" x1="0" y1="1" x2="1" y2="0">
                <stop offset="0%" stop-color="#0E0F11"/><stop offset="60%" stop-color="#1D1E22"/><stop offset="100%" stop-color="#33353A"/>
              </linearGradient>
              <linearGradient id="arrowGrad" x1="0" y1="1" x2="1" y2="0">
                <stop offset="0%" stop-color="#5E0D14"/><stop offset="55%" stop-color="#8E1520"/><stop offset="100%" stop-color="#A81D28"/>
              </linearGradient>
              <radialGradient id="dropShadow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#3A0A10" stop-opacity=".22"/>
                <stop offset="65%" stop-color="#3A0A10" stop-opacity=".06"/>
                <stop offset="100%" stop-color="#3A0A10" stop-opacity="0"/>
              </radialGradient>
            </defs>

            <ellipse class="book-shadow" cx="264" cy="312" rx="230" ry="13" fill="url(#dropShadow)"/>

            <!-- closed book, sits centre until the pages fan open -->

            <!-- right side: black pages -->
            <path class="fan p1" fill="url(#pageInk)" d="M524,238 C470,232 380,232 284,240 C350,258 440,266 524,257 Z"/>
            <g class="fan flip f1">
              <path d="M494,197 C430,192 350,196 269,205 C330,240 420,270 494,278 Z" fill="url(#pageInk)"/>
            </g>
            <g class="fan flip f2">
              <path d="M547,79 C525,120 515,180 512,235 C520,242 535,248 547,251 Z" fill="url(#pageInk)"/>
            </g>

            <!-- left side: red pages -->
            <path class="fan p2" fill="url(#pageRed)" d="M9,238 C65,232 155,232 244,240 C180,258 90,266 9,257 Z"/>
            <path class="fan p1" fill="url(#pageRed)" d="M38,197 C100,192 180,196 258,205 C200,240 110,270 38,278 Z"/>

            <!-- calculator -->
            <g class="calc">
              <rect x="131" y="48" width="148" height="239" rx="14" fill="var(--ink)"/>
              <rect x="145" y="64" width="120" height="40" rx="6" fill="#FFFFFF"/>
              <g fill="#FFFFFF">
                <rect x="145" y="118" width="34" height="26" rx="4"/><rect x="187" y="118" width="34" height="26" rx="4"/><rect x="229" y="118" width="34" height="26" rx="4"/>
                <rect x="145" y="152" width="34" height="26" rx="4"/><rect x="187" y="152" width="34" height="26" rx="4"/><rect x="229" y="152" width="34" height="26" rx="4"/>
                <rect x="145" y="186" width="34" height="26" rx="4"/><rect x="187" y="186" width="34" height="26" rx="4"/><rect x="229" y="186" width="34" height="26" rx="4"/>
                <rect x="145" y="220" width="34" height="26" rx="4"/><rect x="187" y="220" width="34" height="26" rx="4"/><rect x="229" y="220" width="34" height="26" rx="4"/>
              </g>
            </g>

            <!-- ascending bars -->
            <rect class="bar bar1" x="292" y="133" width="27" height="104" rx="3" fill="#7A1219"/>
            <rect class="bar bar2" x="328" y="95"  width="26" height="107" rx="3" fill="#8E1520"/>
            <rect class="bar bar3" x="363" y="63"  width="27" height="102" rx="3" fill="#A81D28"/>

            <!-- rising arrow -->
            <path class="shaft" d="M280,285 C320,255 360,190 400,140 C420,112 435,80 448,55"
                  fill="none" stroke="url(#arrowGrad)" stroke-width="20" stroke-linecap="round"/>
            <polygon class="head" points="485,9 438,45 468,90" fill="#A81D28"/>
          </svg>

      <div class="bloom" aria-hidden="true"></div>
    </div>
  </div>

<script>
  // Drop-in usage:
  //   <div id="cpace-splash" class="run"> ... </div>   (already wired below)
  //   Call window.CPAceSplash.finish() once your app's real assets/data are ready.
  //   It plays the bloom + fade-out, then removes the splash node (or fires a callback).

  const splash = document.getElementById('cpace-splash');
  const shaft  = document.querySelector('.shaft');
  const status = document.getElementById('statusText');

  if (shaft && shaft.getTotalLength) {
    const len = Math.ceil(shaft.getTotalLength());
    shaft.style.strokeDasharray  = len;
    shaft.style.strokeDashoffset = len;
  }

  function play(){
    splash.classList.remove('run');
    void splash.offsetWidth;
    splash.classList.add('run');
  }

  window.CPAceSplash = {
    replay: play,
    setStatus(text){ if (status) status.textContent = text; },
    finish(onDone){
      splash.classList.add('exit');
      splash.addEventListener('animationend', function handler(e){
        if (e.target.classList.contains('bloom')) {
          splash.removeEventListener('animationend', handler);
          if (typeof onDone === 'function') onDone();
          splash.remove();
        }
      });
    }
  };

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(play);

  // demo only: auto-finish after the loading bar completes so you can see the exit —
  // remove this block and call window.CPAceSplash.finish() from your app instead.
  setTimeout(() => window.CPAceSplash.finish(), 5600);
</script>
</body>
</html>
